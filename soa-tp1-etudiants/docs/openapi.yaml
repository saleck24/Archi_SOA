openapi: 3.0.3
info:
  title: API Universite - TP1 SOA
  description: API REST Jakarta EE 10 (JAX-RS) pour la gestion des Etudiants, Departements et Modules
  version: 1.2.0
servers:
  - url: http://localhost:8080/soa-tp1/api
paths:
  # =========================================================
  # ETUDIANTS
  # =========================================================
  /etudiants:
    get:
      summary: Lister les etudiants
      tags: [Etudiants]
      responses:
        '200':
          description: Liste retournee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Etudiant'
    post:
      summary: Creer un etudiant
      tags: [Etudiants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtudiantEntree'
      responses:
        '201':
          description: Etudiant cree
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
        '400':
          $ref: '#/components/responses/ErreurValidation'

  /etudiants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Consulter un etudiant
      tags: [Etudiants]
      responses:
        '200':
          description: Etudiant trouve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    put:
      summary: Remplacer un etudiant (PUT)
      tags: [Etudiants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtudiantEntree'
      responses:
        '200':
          description: Etudiant mis a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
        '400':
          $ref: '#/components/responses/ErreurValidation'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    patch:
      summary: Modifier partiellement un etudiant (PATCH)
      tags: [Etudiants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtudiantPatch'
      responses:
        '200':
          description: Etudiant modifie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
        '400':
          $ref: '#/components/responses/ErreurValidation'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    delete:
      summary: Supprimer un etudiant (DELETE)
      tags: [Etudiants]
      responses:
        '204':
          description: Supprime sans contenu
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'

  # =========================================================
  # DEPARTEMENTS
  # =========================================================
  /departements:
    get:
      summary: Lister les departements
      tags: [Departements]
      responses:
        '200':
          description: Liste des departements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departement'
    post:
      summary: Creer un departement
      tags: [Departements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartementEntree'
      responses:
        '201':
          description: Departement cree
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departement'
        '400':
          $ref: '#/components/responses/ErreurValidation'

  /departements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Consulter un departement
      tags: [Departements]
      responses:
        '200':
          description: Departement trouve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departement'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    put:
      summary: Remplacer un departement (PUT)
      tags: [Departements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartementEntree'
      responses:
        '200':
          description: Departement mis a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departement'
        '400':
          $ref: '#/components/responses/ErreurValidation'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    patch:
      summary: Modifier partiellement un departement (PATCH)
      tags: [Departements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartementPatch'
      responses:
        '200':
          description: Departement modifie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departement'
        '400':
          $ref: '#/components/responses/ErreurValidation'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    delete:
      summary: Supprimer un departement (DELETE)
      tags: [Departements]
      responses:
        '204':
          description: Supprime sans contenu
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'

  # =========================================================
  # MODULES
  # =========================================================
  /modules:
    get:
      summary: Lister les modules
      tags: [Modules]
      responses:
        '200':
          description: Liste des modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
    post:
      summary: Creer un module
      tags: [Modules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleEntree'
      responses:
        '201':
          description: Module cree
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '400':
          $ref: '#/components/responses/ErreurValidation'

  /modules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Consulter un module
      tags: [Modules]
      responses:
        '200':
          description: Module trouve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    put:
      summary: Remplacer un module (PUT)
      tags: [Modules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleEntree'
      responses:
        '200':
          description: Module mis a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '400':
          $ref: '#/components/responses/ErreurValidation'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    patch:
      summary: Modifier partiellement un module (PATCH)
      tags: [Modules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModulePatch'
      responses:
        '200':
          description: Module modifie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '400':
          $ref: '#/components/responses/ErreurValidation'
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'
    delete:
      summary: Supprimer un module (DELETE)
      tags: [Modules]
      responses:
        '204':
          description: Supprime sans contenu
        '404':
          $ref: '#/components/responses/ErreurIntrouvable'

components:
  schemas:
    # --- Etudiants ---
    EtudiantEntree:
      type: object
      required: [nom, email]
      properties:
        nom:
          type: string
          minLength: 1
          example: Aminata
        email:
          type: string
          format: email
          example: aminata@example.org
    EtudiantPatch:
      type: object
      properties:
        nom:
          type: string
        email:
          type: string
          format: email
    Etudiant:
      allOf:
        - $ref: '#/components/schemas/EtudiantEntree'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64

    # --- Departements ---
    DepartementEntree:
      type: object
      required: [nom, code]
      properties:
        nom:
          type: string
          minLength: 1
          example: Informatique
        code:
          type: string
          minLength: 1
          example: INFO
    DepartementPatch:
      type: object
      properties:
        nom:
          type: string
        code:
          type: string
    Departement:
      allOf:
        - $ref: '#/components/schemas/DepartementEntree'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64

    # --- Modules ---
    ModuleEntree:
      type: object
      required: [code, nom]
      properties:
        code:
          type: string
          minLength: 1
          example: SOA
        nom:
          type: string
          minLength: 1
          example: Architecture Orientee Services
        coefficient:
          type: integer
          default: 1
          example: 4
    ModulePatch:
      type: object
      properties:
        code:
          type: string
        nom:
          type: string
        coefficient:
          type: integer
    Module:
      allOf:
        - $ref: '#/components/schemas/ModuleEntree'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64

    # --- Erreur ---
    Erreur:
      type: object
      required: [erreur, message]
      properties:
        erreur:
          type: string
          example: DONNEES_INVALIDES
        message:
          type: string
          example: Donnees invalides

  responses:
    ErreurValidation:
      description: Entree invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    ErreurIntrouvable:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
